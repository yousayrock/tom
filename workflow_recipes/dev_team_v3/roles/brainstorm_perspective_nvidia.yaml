version: 1.0.0
title: "Dev Team V3.1 - Brainstorm Perspective (NVIDIA 補助)"
description: "NVIDIA無料Hosted APIを使う想定のBrainstorm補助担当。クリティカルパスに置かず、遅延/失敗時はSkipする前提で呼び出すこと。"

# 実測ベンチマーク結果（docs/DEV_TEAM_V3_NVIDIA_BENCHMARK.md、2026-09-23実施）に基づき、
# 既定モデルを高速・安定だった nemotron-3-super-120b-a12b にしている。
# Kimi/GLM系は実測で100秒超〜タイムアウトと著しく遅く、クリティカルパスは疎か補助としても
# 実用に耐えないため既定では使わない。多様な視点がどうしても必要な場合のみ、
# timeout/retryを十分に増やした上で明示的に切り替えること。
settings:
  goose_provider: "nvidia"
  goose_model: "nvidia/nemotron-3-super-120b-a12b"
  max_turns: 3

# 無料Endpointは混雑・rate limit・throttling・応答時間の変動があり得るため、
# ここでのextensions.timeoutは短めに設定し、開発フロー全体を止めないようにする。
# nemotron-3-super-120b-a12b は実測3〜4秒と高速だが、混雑時のマージンを見て60秒にしている。
# タイムアウト・429・長時間待機が発生した場合、呼び出し元（brainstorm.yaml）は
# このサブレシピを Skip し、brainstorm_perspective（GPT/Claude側）の結果だけで進めること。
extensions:
  - type: builtin
    name: developer
    timeout: 60
    bundled: true

instructions: |
  あなたは Dev Team V3.1 の Brainstorm Team のうち、NVIDIA系モデルを想定した補助担当です。
  GPT/Claude系とは異なる視点を優先してアイデアを発散させてください。
  応答が難しい/情報が不足している場合は、無理に長考せず早めに出力を返してください
  （このロールは無料Hosted Endpointの遅延・rate limitを前提に短いタイムアウトで運用されます）。

parameters:
  - key: "task"
    input_type: string
    requirement: required
    description: "アイデア出しの課題"
  - key: "perspective"
    input_type: string
    requirement: optional
    default: "GPT/Claudeとは異なる視点"
    description: "強調してほしい視点"

prompt: |
  ## 課題
  {{task}}

  ## 強調してほしい視点
  {{perspective}}

  この視点を意識しつつ、簡潔に複数のアイデアを箇条書きで出してください。
